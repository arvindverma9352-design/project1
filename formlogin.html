<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vegetable Mart</title>
    <link rel="icon" href="logo.png">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url(vegback.png);
            background-repeat: no-repeat;
            background-size: cover;
        }
        .x{
            border: 2px dashed darkblue;
            height: 290px;
            width: 270px;
            padding: 30px;
            background-color: rgb(31, 211, 103);
        }
        .z{
            font-size: 15px;
        }
        .container{
            margin-top: 170px;
        }
        #btn{
            font-size: 20px;
        }


    </style>
</head>
<body>
    <div class="container">
        <!--Login form-->
        <div id="login">
            <h2>Login</h2>
            <form>
                <fieldset class="x">
                    <label for="email">Email:</label><br>
                    <input type="email" placeholder="enter your email" required><br><br>
                    <label for="mobile number">Mobile Number:</label><br>
                    <input type="tel" placeholder="Enter your Mobile Number" required><br><br>
                
                
                    <label for="password">Password:</label><br>
                    <input type="password" placeholder="enter your password" required><br><br>
               <button id="btn" type="submit">Login</button><br>

               <p class="z">If You Not Have an Account / <a href="formsignup.html">Signup</a></p>
               </fieldset> 
            </form>
        </div>
    </div>
    
</body>
</html>
