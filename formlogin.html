<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .input-box {
            margin-bottom: 18px;
        }

        .input-box label {
            display: block;
            margin-bottom: 7px;
            color: #555;
        }

        .input-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
        }

        .input-box input:focus {
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background: #5568d9;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .switch a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        #signup {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Login Form -->
        <div id="login">
            <h2>Login</h2>

            <form>
                <div class="input-box">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>

                <div class="input-box">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>

                <button class="btn" type="submit">Login</button>
            </form>

            <div class="switch">
                Don't have an account?
                <a onclick="showSignup()">Sign Up</a>
            </div>
        </div>


        

</body>
</html>
