<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(name, price, image) {

    let existingProduct = cart.find(item => item.name === name);

    if (existingProduct) {
        existingProduct.quantity++;
    } else {
        cart.push({
            name: name,
            price: price,
            image: image,
            quantity: 1
        });
    }

    saveCart();
    updateCartCount();

    alert(name + " Cart me add ho gaya 🛒");
}


function saveCart() {
    localStorage.setItem("cart", JSON.stringify(cart));
}

function addToWishlist(name, price, image) {
  const wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

  if (!wishlist.some(item => item.name === name)) {
    wishlist.push({ name: name, price: price, image: image });
    localStorage.setItem("wishlist", JSON.stringify(wishlist));
    alert(name + " Wishlist me add ho gaya ♥");
  } else {
    alert(name + " pehle se Wishlist me hai ♥");
  }
}


function updateCartCount() {

    let count = 0;

    cart.forEach(item => {
        count += item.quantity;
    });

    document.getElementById("nav-cart-count").innerText = count;
}


document.addEventListener("DOMContentLoaded", () => {
  updateCartCount();

  document.querySelectorAll(".product").forEach(product => {
    const cartButton = product.querySelector("button[onclick^=\"addToCart\"]");
    if (!cartButton) return;

    const match = cartButton.getAttribute("onclick").match(/addToCart\('([^']+)',\s*([\d]+)/);
    if (!match) return;

    const wishlistButton = document.createElement("button");
    wishlistButton.type = "button";
    wishlistButton.className = "wishlist-button";
    wishlistButton.textContent = "♥ Wishlist";
    wishlistButton.onclick = () => addToWishlist(match[1], Number(match[2]), "images/" + match[1] + ".png");
    product.querySelector(".buttons").appendChild(wishlistButton);
  });
});
</script>
