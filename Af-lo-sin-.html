  pumkin: "Pumpkin", cauliflower: "Cauliflower", cabbage: "Cabbage", brinjal: "Brinjal",
  fenugreekleaves: "Fenugreek Leaves", mustardgreens: "Mustard Greens", corianderleaves: "Coriander Leaves",
  mint: "Mint", bathua: "Bathua", radish: "Radish", beetroot: "Beetroot", sweetpotato: "Sweet Potato",
  garlic: "Garlic", pointgourd: "Pointed Gourd", tinda: "Tinda"
};

function addToCart(name, price, image) {

    let existingProduct = cart.find(item => item.name === name);

    if (existingProduct) {
        existingProduct.quantity++;
      existingProduct.image = existingProduct.image || image || productImages[name];
    } else {
        cart.push({
            name: name,
            price: price,
        image: image || productImages[name],
            quantity: 1
        });
    }

    saveCart();
    updateCartCount();

    showCartToast(name);
}

function showCartToast(name) {
  const toast = document.getElementById("cart-toast");
  toast.innerHTML = `<span class="toast-check">✓</span><span><strong>${name}</strong> cart me add ho gaya</span>`;
  toast.classList.remove("toast-hide");
  toast.classList.add("toast-show");

  clearTimeout(window.cartToastTimer);
  window.cartToastTimer = setTimeout(() => {
    toast.classList.remove("toast-show");
    toast.classList.add("toast-hide");
  }, 2600);
}


function saveCart() {
    localStorage.setItem("cart", JSON.stringify(cart));
}

function addToWishlist(name, price, image) {
  const wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

  if (!wishlist.some(item => item.name === name)) {
    wishlist.push({ name: name, price: price, image: image });
    localStorage.setItem("wishlist", JSON.stringify(wishlist));
    alert(name + " Wishlist me add ho gaya ♥");
  } else {
    alert(name + " pehle se Wishlist me hai ♥");
  }
}


function updateCartCount() {

    let count = 0;

    cart.forEach(item => {
        count += item.quantity;
    });

    document.getElementById("nav-cart-count").innerText = count;
}


document.addEventListener("DOMContentLoaded", () => {
  updateCartCount();

  document.querySelectorAll(".product").forEach(product => {
    const cartButton = product.querySelector("button[onclick^=\"addToCart\"]");
    if (!cartButton) return;

    const match = cartButton.getAttribute("onclick").match(/addToCart\('([^']+)',\s*([\d]+)/);
    if (!match) return;

    const productName = document.createElement("h3");
    productName.className = "product-name";
    productName.textContent = productLabels[match[1]] || match[1];
    product.insertBefore(productName, product.querySelector(".buttons"));

    const wishlistButton = document.createElement("button");
    wishlistButton.type = "button";
    wishlistButton.className = "wishlist-button";
    wishlistButton.textContent = "♥ Wishlist";
    wishlistButton.onclick = () => addToWishlist(match[1], Number(match[2]), "images/" + match[1] + ".png");
    product.querySelector(".buttons").appendChild(wishlistButton);
  });
});
</script>
