<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vegetable Mart</title>
    <link rel="icon" href="logo.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: #17231d;
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(120deg, rgba(13, 72, 45, .92), rgba(38, 146, 91, .62) 52%, rgba(244, 191, 91, .48)), url(images/vegback.png) center / cover;
        }

        body:before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .55;
            background-image: linear-gradient(120deg, rgba(255, 255, 255, .11) 1px, transparent 1px), linear-gradient(30deg, rgba(255, 255, 255, .08) 1px, transparent 1px);
            background-size: 42px 42px;
            animation: texture-drift 18s linear infinite;
        }

        .container {
            width: min(850px, calc(100% - 32px));
            padding: 54px 60px;
            position: relative;
            z-index: 1;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, .7);
            border-radius: 28px;
            background: rgba(255, 255, 255, .88);
            box-shadow: 0 25px 70px rgba(10, 60, 35, .26);
            backdrop-filter: blur(12px);
            animation: welcome-rise .8s ease both;
        }

        .logo {
            width: 116px;
            height: 116px;
            margin: 0 auto 22px;
            display: grid;
            place-items: center;
            border: 8px solid #e7f3c5;
            border-radius: 50%;
            color: #1e7a4b;
            background: #f8fff1;
            box-shadow: 0 12px 25px rgba(30, 122, 75, .18);
            font-size: 61px;
            animation: logo-float 3.5s ease-in-out infinite;
        }

        .logo img {
            width: 82%;
            height: 82%;
            object-fit: contain;
            border-radius: 50%;
        }

        h1 {
            margin: 0 0 14px;
            color: #155c3b;
            font: 700 clamp(30px, 5vw, 54px)/1.08 'Space Grotesk', sans-serif;
            letter-spacing: 0;
        }

        h1 span {
            color: #c45d42;
        }

        .welcome-text {
            max-width: 480px;
            margin: 0 auto 30px;
            color: #6a776f;
            font-size: 16px;
        }

        .account-actions {
            display: flex;
            justify-content: center;
            gap: 14px;
        }

        .account-button {
            min-width: 150px;
            padding: 14px 22px;
            display: inline-block;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            transition: .28s ease;
        }

        .account-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 12px 22px rgba(30, 122, 75, .2);
        }

        .btn1 {
            color: white;
            background: #1e7a4b;
        }

        .btn1:hover {
            background: #125d38;
        }

        .btn2 {
            color: #1e7a4b;
            border: 1px solid #b9d9b2;
            background: #f8fff1;
        }

        .btn2:hover {
            color: white;
            background: #c45d42;
            border-color: #c45d42;
        }

        @keyframes welcome-rise {
            from {
                opacity: 0;
                transform: translateY(28px) scale(.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes logo-float {
            50% {
                transform: translateY(-9px) rotate(4deg);
            }
        }

        @keyframes texture-drift {
            to {
                background-position: 42px 42px, -42px 42px;
            }
        }

        @media (max-width: 520px) {
            .container {
                padding: 42px 24px;
            }

            .account-actions {
                flex-direction: column;
            }

            .account-button {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *:before,
            *:after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo" aria-label="Vegetable Mart logo"><img src="logo.png" alt="Vegetable Mart logo"></div>
        <h1>Welcome to <span>Vegetable Mart</span></h1>
        <p class="welcome-text">Fresh choices for a happier kitchen. Login or create your account to begin shopping.</p>
        <div class="account-actions">
            <a class="account-button btn1" href="formlogin.html">Login <span>→</span></a>
            <a class="account-button btn2" href="formsignup.html">Signup <span>↗</span></a>
        </div>
    </div>


</body>


</html>
