<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vegetable Mart</title>
    <link rel="icon" href="logo.png">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url(vegback.png);
            background-repeat: no-repeat;
            background-size: cover;
        }
        #z{
            border: 2px dashed darkblue;
            height: 320px;
            width: 300px;
            padding: 30px;
            background-color: rgb(31, 211, 103);
        }
        .container{
            margin-top: 180px;
        }
        #btn{
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!--Signup-->
        <h2>Signup</h2>
        <fieldset id="z">
        <form action="">
        <label for="Name">Name:</label><br>
        <input type="text" placeholder="Enter your name" required><br><br>
        <label for="email">Email:</label><br>
        <input type="email" placeholder="Enter your email id" required><br><br>
        <label for="mobile number">Mobile Number:</label><br>
        <input type="tel" placeholder="Enter your Mobile Number" required><br><br>
        <label for="password">Password:</label><br>
        <input type="password" placeholder="Enter Your Password" required><br><br>
        <button id="btn" type="submit">Signup</button>
        <p>If you have an account /<a href="formlogin.html">Login</a> </p>
        </form>
        </fieldset>


    </div>
    
    
</body>
</html>
